# Builds the web app and publishes it.
#
#   push to `develop`  ->  staging   (app-staging.yourdomain.com)
#   push to `main`     ->  production (app.yourdomain.com)
#
# The API address is compiled into the build, so each environment is built
# separately against its own API.
#
# Setup instructions: docs/DEPLOY-CICD.md

name: Deploy frontend

on:
  push:
    branches: [main, develop]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` installs exactly what package-lock.json says, so a build here
      # matches the one on your machine.
      - name: Install
        run: npm ci

      # Catches type errors before they reach anyone. A failure here stops the
      # deploy, which is the point.
      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_MAPTILER_KEY: ${{ secrets.VITE_MAPTILER_KEY }}

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Upload to S3
        # Caching is split by whether the filename changes when the content does.
        #
        #   assets/*  carry a content hash, so a new build means a new name.
        #             Safe to cache forever.
        #
        #   Everything else keeps a STABLE name across builds and must be
        #   revalidated, or the browser serves last month's copy from a name that
        #   still looks current. sw.js is the dangerous one: cache it and the
        #   service worker never updates, so no farmer ever receives a new
        #   version of the app.
        run: |
          BUCKET="s3://${{ vars.S3_BUCKET }}"

          # 1. Fingerprinted assets - cache for a year.
          aws s3 sync dist/ "$BUCKET" --delete \
            --exclude "*" --include "assets/*" \
            --cache-control "public,max-age=31536000,immutable"

          # 2. Everything else, including icons - upload but never cache hard.
          aws s3 sync dist/ "$BUCKET" --delete \
            --exclude "assets/*" \
            --cache-control "public,max-age=0,must-revalidate"

          # 3. Digital Asset Links, which proves to Android that this site and
          #    the Play Store app belong together. Must be JSON and must never
          #    be stale, or the installed app falls back to showing a URL bar.
          if [ -f dist/.well-known/assetlinks.json ]; then
            aws s3 cp dist/.well-known/assetlinks.json "$BUCKET/.well-known/assetlinks.json" \
              --content-type application/json \
              --cache-control "public,max-age=0,must-revalidate"
          fi

      - name: Clear the CloudFront cache
        # Without this, CloudFront keeps serving the previous version from its
        # edge locations for up to a day.
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
