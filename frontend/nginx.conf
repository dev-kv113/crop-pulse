# nginx inside the `web` container: the built app plus a pass-through to the API.
#
# A plain-HTTP cut-down of deploy/nginx-crop-analytics.conf. TLS, certbot and
# the hostname belong to whatever sits in front of this in a real deployment.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Survey GeoJSONs run to 60 MB and up; nginx's 1 MB default would reject
    # the upload with a 413 before the API sees it.
    client_max_body_size 300m;
    client_body_timeout 600s;

    # Shown instead of a raw 502 while the API is down or restarting.
    error_page 502 503 504 /maintenance.html;
    location = /maintenance.html {
        internal;
        add_header Cache-Control "no-store";
    }

    # ---------------------------------------------------------------- API ---
    location /api/ {
        # `api` is the compose service name; 8000 is its port inside the network.
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Importing a plot register runs inline and can take a couple of minutes.
        proxy_connect_timeout 10s;
        proxy_read_timeout   300s;
        proxy_send_timeout   300s;
    }

    location = /.well-known/assetlinks.json {
        default_type application/json;
        add_header Cache-Control "no-store";
    }

    # ------------------------------------------------------------- the app ---
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Never cache these, or a rebuild never reaches the browser.
    location = /index.html           { add_header Cache-Control "no-store"; }
    location = /sw.js                { add_header Cache-Control "no-store"; }
    location = /manifest.webmanifest { add_header Cache-Control "no-store"; }

    # Hash routing: every path resolves to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
