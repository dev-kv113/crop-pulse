# Host nginx for Crop Analytics: HTTPS in front of the `web` container.
#
#   internet -> nginx :443 (this file) -> 127.0.0.1:__WEB_PORT__ (web container)
#                                           ├── /       the built app
#                                           └── /api/   -> api container -> db
#
# A template. `scripts/deploy.sh --setup <domain> <email>` fills in the
# placeholders, writes it to /etc/nginx/conf.d/crop-pulse.conf, and then
# certbot adds the HTTPS server block and the HTTP -> HTTPS redirect to that
# copy. Edit this template and re-run --setup rather than editing the copy.
#
# Caching, routing and the /api pass-through all live in frontend/nginx.conf,
# inside the container. This file only does what the container cannot: hold the
# certificate, and show a maintenance page while the container is down.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # A survey GeoJSON is uploaded through this, and they run to 60 MB and up.
    # nginx's default is 1 MB, which rejects the upload with a 413 before the
    # API ever sees it. The container's nginx has the same limit.
    client_max_body_size 300m;
    # A slow rural connection sending 60 MB needs the request held open.
    client_body_timeout 600s;

    # Shown while the web container is down or restarting mid-deploy. Without
    # this a farmer sees a raw "502 Bad Gateway", which reads as broken rather
    # than temporary. The file is copied out of frontend/public by --setup.
    error_page 502 503 504 /maintenance.html;
    location = /maintenance.html {
        root /usr/share/nginx/crop-pulse;
        internal;
        add_header Cache-Control "no-store";
    }

    location / {
        proxy_pass http://127.0.0.1:__WEB_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Importing a plot register runs inline and can take a couple of
        # minutes on a large unit.
        proxy_connect_timeout 10s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
    }
}
