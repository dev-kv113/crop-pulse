#  nginx for Crop Analytics, alongside the existing analytics dashboard.
#
#  This box already serves analytics.geotranstech.com from /etc/nginx/sites-
#  available/streamlit. This is a SECOND server block on the same nginx, for a
#  second hostname. Nothing about the dashboard changes.
#
#    app.geotranstech.com  ->  nginx :443  ->  static files + 127.0.0.1:8010
#
#  Install:
#    sudo cp deploy/nginx-crop-analytics.conf /etc/nginx/sites-available/crop-analytics
#    sudo ln -sf /etc/nginx/sites-available/crop-analytics /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
#
#  Get the certificate first (see DEPLOY-STAGE2), or nginx will fail to start
#  because the certificate paths below do not exist yet.

server {
    listen 80;
    listen [::]:80;
    server_name app.geotranstech.com;

    # certbot writes its challenge files here
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.geotranstech.com;

    ssl_certificate     /etc/letsencrypt/live/app.geotranstech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.geotranstech.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # The built frontend: plain files, no server process.
    root /home/ubuntu/crop-pulse/frontend/dist;
    index index.html;

    # A survey GeoJSON is uploaded through this, and they run to 60 MB and up.
    # nginx's default is 1 MB, which rejects the upload outright with a 413
    # before the API ever sees it.
    client_max_body_size 300m;

    # A slow rural connection sending 60 MB needs the request held open. These
    # apply to the upload leg specifically; the import itself runs in the
    # background and returns immediately.
    client_body_timeout 600s;

    # --------------------------------------------------------- maintenance ---
    # Shown when the API container is down, restarting, or mid-deploy. Without
    # this a farmer sees a raw nginx "502 Bad Gateway", which reads as broken
    # rather than temporary.
    error_page 502 503 504 /maintenance.html;
    location = /maintenance.html {
        internal;                  # only reachable via error_page, not by URL
        add_header Cache-Control "no-store";
    }

    # ---------------------------------------------------------------- API ---
    location /api/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Importing a plot register runs inline and can take a couple of
        # minutes on a large unit. The analysis layer runs in the background so
        # it returns immediately, but the register does not.
        proxy_connect_timeout 10s;
        proxy_read_timeout   300s;
        proxy_send_timeout   300s;
    }

    # ------------------------------------------------- Play Store trust file ---
    # Must be served as JSON and never cached: a stale copy breaks the Android
    # app's claim to this domain and the address bar reappears.
    location = /.well-known/assetlinks.json {
        default_type application/json;
        add_header Cache-Control "no-store";
    }

    # ------------------------------------------------------------- the app ---
    # Hashed asset filenames change whenever the contents change, so they can be
    # cached hard and for a long time.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html and the service worker must NOT be cached, or a deploy never
    # reaches anyone: the browser keeps serving the old index pointing at old
    # assets.
    location = /index.html      { add_header Cache-Control "no-store"; }
    location = /sw.js           { add_header Cache-Control "no-store"; }
    location = /manifest.webmanifest { add_header Cache-Control "no-store"; }

    # The app uses hash routing, so every path resolves to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
